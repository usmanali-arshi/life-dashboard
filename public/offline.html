<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Life Dashboard</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #121211; color: #fff; text-align: center; padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    h1 { font-size: 20px; font-weight: 650; margin: 0 0 8px; }
    p { color: #c3c2b7; font-size: 15px; line-height: 1.6; margin: 0 0 20px; max-width: 34ch; }
    button {
      background: #fff; color: #121211; border: none; border-radius: 8px;
      padding: 10px 18px; font-size: 14px; font-weight: 550; cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>Your dashboard needs a connection — showing you a stale agenda would be worse than showing you none.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
